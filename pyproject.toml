[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-agent"
version = "0.1.0"
description = "Offline baseline for data quality governance and knowledge release."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.112",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "mcp>=1.27,<2",
  "pandas>=2.2",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.scripts]
dataops-agent-acceptance = "dataops_agent.acceptance:main"
dataops-agent-approval-evidence = "dataops_agent.approval_evidence:main"
dataops-agent-boundary-guard = "dataops_agent.boundary_guard:main"
dataops-agent-ci-quality-matrix = "dataops_agent.ci_quality_matrix:main"
dataops-agent-collaboration = "dataops_agent.collaboration:main"
dataops-agent-contracts = "dataops_agent.contracts:main"
dataops-agent-cross-project-recovery = "dataops_agent.cross_project_recovery:main"
dataops-agent-demo = "dataops_agent.demo:main"
dataops-agent-downstream-regression = "dataops_agent.downstream_regression:main"
dataops-agent-freshness = "dataops_agent.freshness:main"
dataops-agent-hospital-impact = "dataops_agent.hospital_impact:main"
dataops-agent-knowledge-release = "dataops_agent.knowledge_release:main"
dataops-agent-mcp = "dataops_agent.mcp_server:main"
dataops-agent-mcp-showcase = "dataops_agent.mcp_showcase:main"
dataops-agent-performance = "dataops_agent.performance:main"
dataops-agent-portfolio-demo = "dataops_agent.portfolio_demo:main"
dataops-agent-private-sources = "dataops_agent.private_sources:main"
dataops-agent-release-review = "dataops_agent.release_review:main"
dataops-agent-rolling-open-data = "dataops_agent.rolling_open_data:main"
dataops-agent-security-review = "dataops_agent.security_review:main"
dataops-agent-skill-registry = "dataops_agent.skill_registry:main"
dataops-agent-scorecard = "dataops_agent.scorecard:main"
dataops-agent-scenarios = "dataops_agent.scenario_playbook:main"
dataops-agent-training-candidates = "dataops_agent.training_candidates:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
junit_family = "xunit2"
markers = [
  "unit: deterministic unit tests for isolated functions and adapters",
  "api: FastAPI contract and HTTP boundary tests",
  "integration: local workflow tests that touch versioning, checkpoint, or cross-module state",
  "ai_eval: model-provider, RAG, Agent, or AI quality regression tests that do not require live calls by default",
  "security: permission, boundary, injection, secret, or rollback safety tests",
  "performance: local smoke tests for latency, throughput, or regression cost",
  "slow: optional checks that should be excluded from quick local loops",
]

[tool.coverage.run]
branch = true
source = ["dataops_agent"]
omit = [
  "tests/*",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
